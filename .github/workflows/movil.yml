name: Build Flutter Android and Deploy to Mobile Repo

on:
  push:
    branches: ["flutterflow"]
  workflow_dispatch:

jobs:
  build-and-deploy-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Java (for Android)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get


      - name: Build APK (release)
        run: flutter build apk --release

      - name: Package outputs
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/ || true

      - name: Deploy to jsanz994/mobile
        run: |
          git clone https://x-access-token:${{ secrets.ACCESS_TOKEN }}@github.com/jsanz994/movil mobile-repo
          rm -rf mobile-repo/*
          cp out/app-release.apk mobile-repo/ || true

          cd mobile-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy Android build"
          git add .
          git push

